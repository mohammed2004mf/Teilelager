<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161a1f">
  <meta name="color-scheme" content="light dark">
  <script>
    // Hell/Dunkel sofort setzen, damit die Seite beim Laden nicht kurz aufblitzt
    (function () {
      var t = null;
      try { t = localStorage.getItem('teilelager.theme'); } catch (e) {}
      if (t !== 'hell' && t !== 'dunkel') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dunkel' : 'hell';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <title>Teilelager</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="application-name" content="Teilelager">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"><div class="boot">Teilelager wird geladen …</div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
